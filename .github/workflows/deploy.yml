name: Deploy no Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necessário para autenticar no Google via Workload Identity Federation

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Sem chave JSON: o GitHub prova a identidade do repositório ao Google.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/968526686018/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deploy@ponto-x4.iam.gserviceaccount.com

      - run: npx firebase-tools deploy --only hosting --project ponto-x4
